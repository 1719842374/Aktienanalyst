name: restore-section-numbering
on:
  workflow_dispatch:
  push:
    branches: [fix/section-numbering-1-19]
    paths:
      - scripts/restore_section_numbering.py
      - .github/workflows/restore-section-numbering.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/section-numbering-1-19
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Restore three files from main + transforms
        run: python3 scripts/restore_section_numbering.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/sections/TechnicalChart.tsx \
                  client/src/components/sections/Section2.tsx \
                  client/src/pages/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: restore full Tech/Section2/Dashboard (badges 1-20)"
          git push origin HEAD:fix/section-numbering-1-19
